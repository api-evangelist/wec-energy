description: WEC Energy Group is a regulated electric and natural-gas utility holding company (We
  Energies, Wisconsin Public Service, Peoples Gas, North Shore Gas, Michigan Gas Utilities, Minnesota
  Energy Resources, Upper Michigan Energy Resources). Customer energy data is exposed to ratepayers via
  Green Button Connect / Download, but no public, self-serve developer API plan, tiered pricing, or
  per-call rate is published; programmatic access for third parties is governed by Green Button
  authorization flow and bilateral data-sharing agreements with the operating company.
notes: wecenergygroup.com publishes corporate / IR information only; no developer plans page found.
  Customer-authorized data sharing is via Green Button at the operating-company level.
