  PublisherName: WEC Energy Group, Inc.
  InvoiceIssuerName: We Energies / WPS / Peoples Gas / North Shore Gas / MGU / MERC / UMERC
  BillingCurrency: USD
meters:
  - name: electric_consumption
    description: Electricity delivered to the meter at the operating-company tariff.
    unit: kWh
    aggregation: sum
    dimensions:
      - operating_company
      - rate_class
      - meter_id
  - name: gas_consumption
    description: Natural gas delivered to the meter at the operating-company tariff.
    unit: therm
    aggregation: sum
    dimensions:
      - operating_company
      - rate_class
      - meter_id
principles:
  - name: Visibility
    description: Spend visibility is via the operating-company customer portal and Green Button
      Download / Connect for the authorized customer; there is no public corporate usage API.
  - name: Allocation
    description: Allocate energy spend by site / meter / rate-class using the operating-company account
      hierarchy and Green Button service-point IDs.
  - name: Optimization
    description: Optimization levers are tariff selection, demand-response participation, energy-efficiency
      programs, and on-site generation under the operating company's interconnection rules.
  - name: Accountability
    description: Facilities / energy-management owners hold accountability and engage the operating
      company's commercial / large-customer team for tariff and program decisions.
