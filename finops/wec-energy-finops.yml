description: FinOps placement for WEC Energy Group. The "spend" surface here is regulated utility
  charges (kWh / therms) at the operating-company level plus any data-sharing-agreement fees, not a
  metered developer API.
notes: No public usage-billing API for developer integrations. FOCUS mapping reflects utility-billing
  shape only.
sources:
  - https://www.wecenergygroup.com/
billingModel:
  pricingCategory: Regulated Utility Tariff
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Tax
focusColumns:
  ServiceName: WEC Energy Group
  ServiceCategory: Energy / Utility
