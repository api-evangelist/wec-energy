description: WEC Energy Group does not publish a developer rate-limit policy. Where a Green Button
  Connect endpoint is operated by an underlying operating company, throughput limits are governed by
  that company's Green Button gateway configuration and the executed third-party data-sharing
  agreement, not by a public quota policy at the holding-company level.
notes: No public rate-limit documentation found at wecenergygroup.com.
sources:
  - https://www.wecenergygroup.com/
responseCodes: {}
limits:
  - name: Negotiated Throughput
    scope: contract
    metric: varies
    limit: see operating-company Green Button / data-sharing agreement
policies:
  - name: Contract-Defined Limits
    description: Concurrency and request budgets are set in the data-sharing agreement with the
      operating company (We Energies, WPS, Peoples Gas, etc.) and the Green Button gateway configuration.
